# MEDCORE web nginx: serve the SPA and proxy the API same-origin.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache index.html so SPA deploys take effect immediately.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Hashed assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API is same-origin under /api -> the backend (prefix stripped), matching the
  # frontend's API_BASE and the dev proxy. No CORS surface.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
